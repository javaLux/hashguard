[package]
name = "hashguard"
version = "5.0.2"
edition = "2024"
description = "Command-Line tool for ensuring the integrity of files using hash sums"
authors = ["javaLux"]
license = "MIT"
repository = "https://github.com/javaLux/hashguard"
readme = "README.md"
keywords = ["file", "cli", "tools", "hash", "cryptography"]
categories = ["command-line-utilities", "development-tools", "cryptography"]
rust-version = "1.85.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
clap = { version = "4.6.1", features = ["derive", "cargo", "string"] }
ctrlc = "3.5.2"
indicatif = { version = "0.18.4", default-features = false }
log = "0.4.31"
os_info = { version = "3.15.0", default-features = false }
path-absolutize = "3.1.1"
percent-encoding = "2.3.2"
regex = { version = "1.12.3", default-features = false, features = ["unicode"] }
dirs = "6.0.0"
simplelog = "0.12.2"
ureq = "3.3.0"
url = { version = "2.5.8", default-features = false }
anyhow = "1.0.102"
sha2 = "0.11.0"
sha3 = "0.12.0"
hex = "0.4.3"
walkdir = "2.5.0"
termcolor = "1.4.1"

[profile.release]
# compiler optimizations for binary size
opt-level = "s"
# link optimizations -> causes a longer link time but produce better optimize code
lto = true
# strip either symbols or debug info from the final binary
strip = true
